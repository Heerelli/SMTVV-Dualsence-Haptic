; 기존 SMT5V-Haptics.ini 맨 아래에 이 섹션을 붙여 넣으세요.
[DualSense]
Enabled=1
; 오디오 장치 이름에 이 문자열이 들어가면 듀얼센스로 인식 ("DualSense"도 자동 인식)
DeviceName=Wireless Controller
; 전체 햅틱 세기 0.0 ~ 2.0
Gain=1.0
; 0 = 햅틱만 (기존 럼블 끔), 1 = 기존 럼블도 같이
PassThroughRumble=0
; 1 = 모드가 보내는 모터 값도 햅틱으로 변환 (F6~F8 모터 테스트용). 게임 원본엔 진동이 없어서 기본 0
MotorToHaptics=0
MotorLowHz=55
MotorHighHz=160
; 모드 이벤트 로그를 기다리는 시간(ms). 이 시간 안에 이벤트가 오면 이벤트 전용 파형을 씁니다.
MotorDelayMs=12
BufferMs=10
; 듀얼센스 4채널 중 햅틱 채널 (0부터 셈: 2,3 = 3·4번째)
LeftChannel=2
RightChannel=3
MuteWhenUnfocused=1
; F11 = 이벤트 파형 순서대로 테스트
TestHotkey=1
