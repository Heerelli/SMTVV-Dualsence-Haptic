; SMTVV DualSense Haptic - 추가 햅틱 추천 설정
; 원본 모드의 SMT5V-Haptics.ini 에서 [SoundRules] 아래,
; 기존 줄(fld_encount=normal 등) 다음에 붙여 넣으세요.
; 게임 중 F4 를 누르면 바로 다시 읽습니다.
; 형식: 효과음이름=normal|critical|weak|sound|guard

; 마가츠히 위험 감지: 넓게 퍼지는 울림
fld_obj_maga_danger=sound
; 내 턴 시작: 짧은 "탁" 뒤에 부드러운 저음
btl_turn1_player=guard
; 적 턴 시작: 짧은 "탁" 뒤에 부드러운 저음
btl_turn2_enemy=guard
; 동료(악마) 소환: 넓게 퍼지는 짧은 울림
sys_60_devil_summon=sound
