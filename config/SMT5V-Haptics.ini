; SMT5V Haptics (snm01234) v0.6 기본 설정 + SMTVV DualSense Haptic 추천 추가 햅틱
; 게임 Project\Binaries\Win64\SMT5V-Haptics.ini 를 이 파일로 덮어쓰세요.

[General]
Enabled=1
; Native Sound-style gauge: 0 (off), 5 (original mod strength), 10 (up to 2x).
Intensity=5
; Log actual CRI playback starts for selecting exact effect identifiers.
TraceSounds=1

[SoundRules]
; Exact CueName=normal|critical|weak|sound|guard
; Normal/critical/weak battle damage already uses the damage display event.
fld_encount_hitstamp=normal
fld_chest_break3=normal
; Contact sound is suppressed for 1 second after the player's symbol strike.
fld_encount=normal

; --- 추가 햅틱 (SMTVV DualSense Haptic 추천) ---
; 마가츠히 위험 감지: 넓게 퍼지는 울림
fld_obj_maga_danger=sound
; 대시 시작: 짧은 "톡"
fld_Pla603_dash=normal
; 내 턴 시작: 짧은 "탁" 뒤에 부드러운 저음
btl_turn1_player=guard
; 적 턴 시작: 짧은 "탁" 뒤에 부드러운 저음
btl_turn2_enemy=guard
; 동료(악마) 소환: 넓게 퍼지는 짧은 울림
sys_60_devil_summon=sound
